<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R34PER Terminal</title>
<style>
  :root { --bg:#070b09; --panel:#0d1512; --line:#1c2b24; --acc:#39ff88; --acc2:#27c46a; --txt:#c9e7d6; --dim:#6d8f7d; --red:#ff5f56; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(1200px 600px at 50% -10%, #0e1a13 0%, var(--bg) 60%); color:var(--txt); font-family:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .logo { color:var(--acc); font-weight:700; letter-spacing:2px; }
  .logo span { color:var(--red); }
  .badge { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:3px 10px; }
  #status { margin-left:auto; font-size:11px; color:var(--dim); }
  #chat { flex:1; overflow-y:auto; padding:20px 12px; }
  .wrap { max-width:960px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .msg { padding:12px 16px; border-radius:12px; line-height:1.55; white-space:pre-wrap; word-break:break-word; font-size:14px; }
  .user { align-self:flex-end; max-width:85%; background:#122019; border:1px solid #23483a; }
  .agent { align-self:flex-start; max-width:100%; background:var(--panel); border:1px solid var(--line); }
  .err { color:var(--red); border-color:var(--red); }
  .tool { align-self:flex-start; max-width:100%; border:1px solid var(--line); border-radius:10px; background:#0a100d; font-size:12.5px; }
  .tool summary { cursor:pointer; padding:9px 14px; color:var(--acc); font-size:12px; letter-spacing:1px; list-style:none; }
  .tool pre { padding:10px 14px; border-top:1px solid var(--line); overflow-x:auto; color:#9fd8b8; white-space:pre-wrap; word-break:break-all; }
  pre.code { background:#050a07; border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; margin:8px 0; font-size:12.5px; color:#a8e6c0; }
  footer { border-top:1px solid var(--line); padding:12px 12px 16px; }
  .bar { max-width:960px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
  textarea { flex:1; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:11px 13px; font:inherit; font-size:14px; resize:none; height:46px; }
  textarea:focus { outline:1px solid var(--acc2); }
  button { background:var(--panel); color:var(--acc); border:1px solid var(--acc2); border-radius:10px; padding:11px 16px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.4 }
  #send { background:#0f2c1c; }
  #stop { color:var(--red); border-color:var(--red); }
  #clear { color:var(--dim); border-color:var(--line); }
  .hint { max-width:960px; margin:6px auto 0; font-size:10.5px; color:var(--dim); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <div class="logo">R34PER<span>_</span>AGENT</div>
  <div class="badge" id="model">connecting...</div>
  <div id="status">idle</div>
</header>
<div id="chat"><div class="wrap" id="wrap"></div></div>
<footer>
  <form class="bar" id="form">
    <textarea id="input" placeholder="Command the agent. It executes." rows="1"></textarea>
    <button id="stop" type="button" hidden>Stop</button>
    <button id="send" type="submit">Send</button>
    <button id="clear" type="button">Reset</button>
  </form>
  <div class="hint"><span>Sandboxed Linux container. Only run against systems you are authorized to test.</span><span id="sess"></span></div>
</footer>
<script>
const wrap = document.getElementById('wrap');
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const form = document.getElementById('form');
const send = document.getElementById('send');
const stopBtn = document.getElementById('stop');
const statusEl = document.getElementById('status');
const FENCE = '\x60\x60\x60';
let sessionId = null;
let running = false;
let controller = null;

function esc(s){ const d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function addMsg(cls){ const m = document.createElement('div'); m.className = 'msg ' + cls; wrap.appendChild(m); scrollDown(); return m; }
function addTool(title, code){ const t = document.createElement('details'); t.className = 'tool'; t.innerHTML = '<summary>' + title + '</summary><pre>' + esc(code) + '</pre>'; wrap.appendChild(t); t.open = true; scrollDown(); return t; }

function renderText(el, t){
  const parts = String(t).split(FENCE);
  let html = '';
  parts.forEach((p, i) => {
    if (i % 2 === 1){
      const lines = p.split('\n');
      const first = lines[0].trim();
      const body = (/^[a-zA-Z0-9+#._-]{1,16}$/.test(first) && lines.length > 1) ? lines.slice(1).join('\n') : p;
      html += '<pre class="code">' + esc(body) + '</pre>';
    } else if (p.trim()){
      html += '<p>' + esc(p) + '</p>';
    }
  });
  el.innerHTML = html;
  scrollDown();
}

function trunc(s, n){ s = String(s); return s.length > n ? s.slice(0, n) + ' ...[truncated]' : s; }

async function health(){
  try {
    const r = await fetch('/api/health');
    const j = await r.json();
    document.getElementById('model').textContent = (j.api_key_set ? '' : 'KEY MISSING | ') + j.model + ' @ ' + j.workdir;
  } catch (e) {
    document.getElementById('model').textContent = 'server offline';
  }
}

function handleEvent(e){
  if (e.type === 'session'){ sessionId = e.session_id; document.getElementById('sess').textContent = 'session ' + e.session_id.slice(0, 8); return; }
  if (e.type === 'assistant_text'){ const m = addMsg('agent'); renderText(m, e.content); return; }
  if (e.type === 'tool_call'){ addTool('[TOOL] ' + String(e.name).toUpperCase(), JSON.stringify(e.arguments, null, 2)); return; }
  if (e.type === 'tool_result'){ addTool('[OUT] ' + String(e.name).toUpperCase(), trunc(JSON.stringify(e.result, null, 2), 4000)); return; }
  if (e.type === 'final'){ const last = wrap.children[wrap.children.length - 1]; if (last && last.className.indexOf('agent') >= 0){ renderText(last, e.content); } else { renderText(addMsg('agent'), e.content); } return; }
  if (e.type === 'error'){ addMsg('agent err').textContent = e.content; return; }
}

async function runChat(msg){
  const agentEl = addMsg('agent');
  agentEl.textContent = '...';
  controller = new AbortController();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId }),
      signal: controller.signal
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true){
      const chunk = await reader.read();
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0){
        const line = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (line.startsWith('data: ')){
          try { handleEvent(JSON.parse(line.slice(6))); } catch (err) {}
        }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError'){ addMsg('agent err').textContent = 'Connection lost: ' + e; }
  }
  if (agentEl.textContent === '...') agentEl.remove();
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const msg = input.value.trim();
  if (!msg || running) return;
  input.value = '';
  addMsg('user').textContent = msg;
  running = true; send.disabled = true; stopBtn.hidden = false; statusEl.textContent = 'agent working...';
  await runChat(msg);
  running = false; send.disabled = false; stopBtn.hidden = true; statusEl.textContent = 'idle';
});

stopBtn.addEventListener('click', () => { if (controller) controller.abort(); });
document.getElementById('clear').addEventListener('click', async () => {
  wrap.innerHTML = '';
  if (sessionId) {
    await fetch('/api/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId }) });
  }
  sessionId = null;
  document.getElementById('sess').textContent = '';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});

health();
</script>
</body>
</html>
